name: Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build the package
    uses: ./.github/workflows/build.yaml

  docs:
    name: Build the docs
    uses: ./.github/workflows/docs.yaml

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Get current version
        id: current
        run: |
          version=$(git tag --sort=-version:refname | head -n 1)
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Get previous version
        id: previous
        run: |
          version=$(git tag --sort=-version:refname | head -n 2 | tail -1)
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Construct release notes
        run: |
          echo -e "\n## Commits\n" > release_notes.md
          git log --oneline ${{ steps.previous.outputs.version }}..${{ steps.current.outputs.version }} >> release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.current.outputs.version }}
          name: differences ${{ steps.current.outputs.version }}
          body_path: release_notes.md
          draft: true

  publish:
    name: Publish on PyPI
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI Trusted Publisher (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: dist/
          verbose: true
